name: Update YouTube Trends

on:
  schedule:
    - cron: '27 */1 * * *' # 混雑を逃れる毎時27分の設定（全世界の00分集中ピークによるスキップや数時間遅延の被害を激減！）
  workflow_dispatch: # 手動実行用ボタン
  repository_dispatch:
    types: [trigger-scraper] # WebアプリからのAPI経由での実行トリガー

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必須：作成した logs.json をGitHubリポジトリへPush保存できるようにする権限！
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          cd scraper
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Trend Collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_CHANNELS_DB_ID: ${{ secrets.NOTION_CHANNELS_DB_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          cd scraper
          python trend_collector.py

      - name: Commit and Push Execution Logs back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scraper/logs.json
          git commit -m "[Auto-Log] Update trend collector logs [skip ci]" || echo "No log changes to commit"
          git pull --rebase origin main || true
          git push origin main

name: Update YouTube Trends

on:
  workflow_dispatch: # 手動実行用ボタン
  repository_dispatch:
    types: [trigger-scraper] # Webアプリ・外部からのAPI経由での実行トリガー



jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必須：作成した logs.json をGitHubリポジトリへPush保存できるようにする権限！
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          cd scraper
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      # 公式SNS(X)を読むための中継サーバー(RSSHub)を、この巡回の間だけ立ち上げる。
      # 以前は Railway に常時置いていたが、無料期間が終わって止まった（2026-10）。
      # X は RSSHub がブラウザを使わず auth_token 1つで読めるため、毎回の起動で足りる
      # （lib/routes/twitter/user.ts は requirePuppeteer: false）。公開リポジトリなので費用はかからない。
      # 起動に失敗しても収集本体は止めない。YouTube・広告・Reddit はそのまま動く。
      - name: Start RSSHub for this run
        id: rsshub
        continue-on-error: true
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
        run: |
          # 値はコマンドに書かず、環境変数の名前だけを渡す（ログに残さないため）
          docker run -d --name rsshub -p 1200:1200 \
            -e NODE_ENV=production \
            -e TWITTER_AUTH_TOKEN \
            diygod/rsshub
          for i in $(seq 1 45); do
            if curl -sf http://localhost:1200/healthz > /dev/null; then
              echo "RSSHub ready (${i} checks)"
              echo "url=http://localhost:1200" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          echo "RSSHub did not become ready"
          docker logs rsshub 2>&1 | tail -30
          exit 1

      - name: Run Trend Collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_CHANNELS_DB_ID: ${{ secrets.NOTION_CHANNELS_DB_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTION_LOG_DB_ID: ${{ secrets.NOTION_LOG_DB_ID }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          DISCORD_ALERT_ENABLED: ${{ vars.DISCORD_ALERT_ENABLED }}
          # 上の手順で立ち上げた RSSHub。起動に失敗した回は空になり、
          # 収集側は X・BiliBili・Weibo を見送って Reddit だけを読む。
          RSSHUB_BASE_URL: ${{ steps.rsshub.outputs.url }}
        run: |
          cd scraper
          python trend_collector.py

      - name: Purge videos matching exclude words (retroactive cleanup)
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          cd scraper
          python purge_excluded.py --apply
        continue-on-error: true # 掃除処理の失敗で本体の収集成功を無駄にしないため

      - name: Commit and Push Execution Logs back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scraper/logs.json
          # 広告IDと動画の対応表。持ち帰らないと毎回すべてのプレビューを
          # 取り直すことになり、Google側にも無駄な負荷をかける。
          git add scraper/ad_creative_cache.json
          git commit -m "[Auto-Log] Update trend collector logs [skip ci]" || echo "No log changes to commit"
          git pull --rebase origin main || true
          git push origin main
